<form (ngSubmit)="OnSubmit(Title, Title.value, Request.value)" #form>
    <app-control title="Title">
        <input name="title" id="title" #Title/>
    </app-control>
    <app-control title="Requst">
        <textarea name="request" id="request" rows="3" #Request></textarea>
    </app-control>
    <p>
        <button appButton>
            Submit 
            <span class="icon">
                ➤
            </span>
        </button>
    </p>
</form>
